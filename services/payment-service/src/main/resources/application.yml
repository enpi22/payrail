payrail:
  providers:
    mock:
      auto-callback: true
      callback-delay-ms: 2000
      callback-secret: ${MOCK_PROVIDER_SECRET:mock-secret-change-me}
spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payrail}
    username: ${DB_USER:payrail}
    password: ${DB_PASSWORD:payrail}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
