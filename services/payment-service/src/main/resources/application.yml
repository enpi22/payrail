payrail:
  providers:
    mock:
      auto-callback: true
      callback-delay-ms: 2000
      callback-secret: ${MOCK_PROVIDER_SECRET:mock-secret-change-me}
    fees:
      basis-points: 200   # 2%
    outbox:
      poll-interval-ms: 500
    webhooks:
      poll-interval-ms: 1000
      batch-size: 50
      lease-seconds: 60
      request-timeout-ms: 10000
      retry-delays-seconds: 60,300,1800,7200,21600   # 1m, 5m, 30m, 2h, 6h → 6 attempts, then DEAD
      allow-local-targets: ${WEBHOOKS_ALLOW_LOCAL_TARGETS:false}
spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payrail}
    username: ${DB_USER:payrail}
    password: ${DB_PASSWORD:payrail}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  producer:
    acks: all
    properties:
      enable.idempotence: true
  consumer:
    auto-offset-reset: earliest
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
